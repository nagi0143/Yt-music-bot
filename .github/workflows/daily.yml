name: build-video

on:
  workflow_dispatch:
    inputs:
      per_run:
        description: "Is run mein kitne song (1-3)"
        required: false
        default: "1"
  schedule:
    - cron: "30 18 * * *"
    - cron: "30 2 * * *"
    - cron: "30 9 * * *"

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: fonts
        run: |
          mkdir -p assets
          B="https://raw.githubusercontent.com/google/fonts/main/ofl"
          curl -fsSL "$B/anton/Anton-Regular.ttf" -o assets/Anton-Regular.ttf || true
          curl -fsSL "$B/bebasneue/BebasNeue-Regular.ttf" -o assets/BebasNeue-Regular.ttf || true
          curl -fsSL "$B/greatvibes/GreatVibes-Regular.ttf" -o assets/GreatVibes-Regular.ttf || true
          curl -fsSL "$B/notosansdevanagari/NotoSansDevanagari%5Bwdth,wght%5D.ttf" -o assets/NotoSansDevanagari.ttf || true
          ls -la assets
          python -c "from PIL import ImageFont as F; [F.truetype('assets/'+f,40) for f in ['Anton-Regular.ttf','BebasNeue-Regular.ttf','GreatVibes-Regular.ttf']]; print('FONTS OK')"

      - name: queue status
        run: |
          mkdir -p songs
          echo "Queue: $(ls -1 songs/*.mp3 2>/dev/null | wc -l) song(s)" >> $GITHUB_STEP_SUMMARY

      - name: build and upload
        run: |
          N="${{ github.event.inputs.per_run }}"
          N="${N:-1}"
          for i in $(seq 1 "$N"); do
            echo "::group::job $i"
            python pipeline.py
            if [ -f work/used.txt ]; then
              python upload.py
              rm -f "songs/$(cat work/used.txt)"
            fi
            echo "::endgroup::"
          done
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}

      - name: save state
        if: always()
        run: |
          git config user.name bot
          git config user.email bot@x.com
          git add -A songs state.json
          git commit -m "queue progress" || true
          git push || true
