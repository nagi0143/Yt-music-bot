
channel: "Midnight Verses"

languages: [english, hindi, english, spanish, hindi, portuguese, japanese, korean]

themes:
  - "two lovers who can only meet in dreams"
  - "a ghost waiting at the same bus stop every night"
  - "promising to find each other in the next life"
  - "loving someone who is already gone"
  - "a city that remembers your name after you leave"
  - "borrowed time, one last monsoon night"
  - "a heart that beats in someone else's chest"
  - "the moon as the only witness"

# Permanent NOXVEILx9 musical identity
master_style: |
  Dark romantic fantasy pop fused with trap-soul,
  cinematic indie and atmospheric electronic production.
  Rich emotional melodies, deep punchy drums,
  warm analog textures, haunting atmospheric layers,
  intimate expressive vocals, immersive cinematic depth,
  polished professional mixing and mastering.
  Every song must have a recognizable NOXVEILx9 sound,
  while maintaining its own original musical identity.

# Base genre identity
genre_style: |
  dark romantic fantasy pop, trap-soul drums,
  cinematic indie, atmospheric electronic,
  warm analog mix, intimate close vocals.

# Vocal selection rules
vocal_rules: |
  Only two vocal formats are allowed:
  1. Male and female duet.
  2. Female solo.

  Never generate male solo vocals.

  Male voice in duets:
  Deep, youthful, powerful, warm and natural.
  Avoid elderly-sounding, excessively heavy or rough vocals.

  Female voice:
  Soft, sweet, expressive, clear and natural.
  Avoid excessively deep or robotic vocals.

  In duets, both voices must have distinct parts
  and natural vocal chemistry.
  Never sing production instructions or role labels.

# Music settings
duration_sec: 150
loudness_lufs: -14

# Gemini songwriting instructions
lyrics_prompt: |
  You are a professional songwriter and music director
  creating original songs for the Midnight Verses channel.

  LANGUAGE: {lang}
  THEME: {theme}

  PERMANENT MUSICAL IDENTITY:
  Dark romantic fantasy pop fused with trap-soul,
  cinematic indie and atmospheric electronic production.
  Rich emotional melodies, deep punchy drums,
  warm analog textures, haunting atmospheric layers,
  intimate expressive vocals and polished professional mixing.

  VOCAL RULES:
  Choose exactly one vocal format for each song:
  - Male + female duet
  - Female solo

  Never create male solo songs.

  Male voice in duets must sound deep, youthful,
  powerful, warm and natural, never elderly.
  Female voice must sound soft, sweet, expressive
  and natural, never excessively deep.

  Duets must have clearly differentiated male
  and female vocal sections with natural chemistry.
  Female solo songs must contain only female vocals.

  SONGWRITING:
  Structure:
  Verse 1 (4 lines)
  Pre-chorus (2 lines)
  Chorus (4 lines)
  Verse 2 (4 lines)
  Chorus (4 lines)
  Bridge (2 lines)
  Final chorus (4 lines)

  Write original lyrics in the requested language.
  Use first-person storytelling and concrete imagery
  such as rain, neon, ruins, moonlight, velvet,
  static, ghosts and ash.

  Create one memorable four-word hook.
  Repeat the exact hook in every chorus.
  Use short, naturally singable lines.
  Avoid generic romantic cliches.

  MUSICAL VARIATION:
  Keep the permanent NOXVEILx9 sound identity,
  but create a fresh melody, rhythm, arrangement,
  emotional atmosphere and instrumental progression
  for every song.

  BPM can vary naturally between 78 and 105.
  Do not force every song into the same melody,
  arrangement or emotional intensity.

  IMPORTANT:
  Do not include production instructions,
  vocal labels or prompt explanations inside lyrics.
  Vocal assignments must be described separately.

  Return STRICT JSON only:
  {{
    "title": "",
    "hook": "",
    "lyrics": "",
    "vocal_mode": "duet or female_solo",
    "style_prompt": "",
    "bpm": 0,
    "thumb_text": "",
    "description_hook": ""
  }}

# YouTube SEO instructions
seo_prompt: |
  You write professional YouTube metadata for a
  dark romantic fantasy music channel.

  Language: {lang}
  Song title: "{title}"

  Return STRICT JSON only:
  {{"title":"","description":"","tags":[]}}

  TITLE:
  Maximum 62 characters.
  Emotion-focused, natural and searchable.
  No misleading clickbait.

  DESCRIPTION:
  Three short paragraphs.
  Include an emotional hook line.
  Include "Best with headphones".
  Include "AI-generated music".
  End with exactly 3 relevant hashtags.

  COPYRIGHT:
  Do not falsely claim ownership of music,
  lyrics or samples.
  Do not invent licensing or ownership claims.

  TAGS:
  Return 25 relevant tags.
  Mix broad and long-tail search terms.
  Include both {lang} and English keywords.
