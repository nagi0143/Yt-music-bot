QUEUE_RETRIES = 10
QUEUE_SLEEP = 200


def music(style, lyric_text):
    payload = {
        "prompt": f"{style}. Dark romantic, emotional, clear intimate "
                  "lead vocal, wide cinematic mix.",
        "lyrics": lyric_text,
        "duration": MUSIC_SECONDS,
        "bpm": 84,
        "instrumental": False,
    }
    headers = {"Authorization": f"Bearer {FREEAI}",
               "Content-Type": "application/json"}

    d = None
    for attempt in range(1, QUEUE_RETRIES + 1):
        r = requests.post("https://api.free.ai/v1/music/generate/",
                          headers=headers, json=payload, timeout=(30, 300))

        if r.status_code == 429 and "queue_at_capacity" in r.text:
            wait = QUEUE_SLEEP + random.randint(0, 120)
            print(f"queue full ({attempt}/{QUEUE_RETRIES}), waiting {wait}s")
            time.sleep(wait)
            continue

        if r.status_code == 402:
            print("TOKENS KHATAM:", r.text[:300])
            raise RuntimeError("free.ai tokens exhausted")

        if not r.ok:
            print("FREEAI MUSIC ERROR:", r.status_code, r.text[:500])
            r.raise_for_status()

        d = r.json()
        break
    else:
        raise RuntimeError("music queue stayed full the whole time")

    print("MUSIC RESPONSE KEYS:", list(d.keys()))
    url = d.get("audio_url") or d.get("url")
    job = d.get("job_id") or d.get("id")

    for _ in range(90):
        if url:
            break
        if not job:
            break
        time.sleep(10)
        s = requests.get(f"https://api.free.ai/v1/status/{job}/",
                         headers={"Authorization": f"Bearer {FREEAI}"},
                         timeout=60)
        j = s.json() if s.ok else {}
        url = j.get("audio_url") or (j.get("result") or {}).get("audio_url")
        if str(j.get("status", "")).lower() in ("failed", "error"):
            raise RuntimeError(f"music job failed: {j}")

    if not url:
        raise RuntimeError(f"no audio url in response: {d}")

    raw = requests.get(url, timeout=300)
    raw.raise_for_status()
    (WORK / "raw_audio").write_bytes(raw.content)
    subprocess.run(["ffmpeg", "-y", "-i", str(WORK / "raw_audio"),
                    "-c:a", "libmp3lame", "-b:a", "256k",
                    str(WORK / "song.mp3")], check=True)
