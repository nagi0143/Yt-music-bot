channel: "Midnight Verses"
languages: [english, hindi, english, spanish, hindi, portuguese, japanese, korean]

themes:
  - "two lovers who can only meet in dreams"
  - "a ghost waiting at the same bus stop every night"
  - "promising to find each other in the next life"
  - "loving someone who is already gone"
  - "a city that remembers your name after you leave"
  - "borrowed time, one last monsoon night"
  - "a heart that beats in someone else's chest"
  - "the moon as the only witness"

genre_style: "dark romantic fantasy pop, trap-soul drums, cinematic indie, warm analog mix, 84 bpm, intimate close vocal"
music_duration: 120
loudness_lufs: -14

lyrics_prompt: |
  You are a professional {lang} songwriter. Write a song with this structure:
  verse 1 (4 lines) / pre-chorus (2 lines) / chorus (4 lines) / verse 2 (4 lines) /
  chorus (4 lines) / bridge (2 lines) / final chorus (4 lines).
  Theme: {theme}
  Genre: dark romantic fantasy pop with trap-soul rhythm.
  Rules: first person, intimate, concrete imagery (rain, neon, ruins, moonlight,
  velvet, static, ghosts, ash), one 4-word hook repeated in every chorus,
  short lines that breathe, NO cliches like "you're my everything".
  Output STRICT JSON only:
  {{"title":"","hook":"","lyrics":"","style_prompt":"","bpm":0,"thumb_text":"","description_hook":""}}

seo_prompt: |
  You write YouTube metadata for a {lang} dark romantic fantasy song called "{title}".
  Return STRICT JSON only:
  {{"title":"","description":"","tags":[]}}
  Title: max 62 chars, hook + emotion word + "Song", no clickbait lies.
  Description: 3 short paragraphs, hook line, 3 hashtags at end,
  plus "Best with headphones" and "AI-generated music".
  Tags: 25 items, mix of broad and long-tail, in {lang} and English.
